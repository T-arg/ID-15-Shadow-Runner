<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Runner — TEAM a.r.g.</title>
  <meta name="description" content="Shadow Runner (ID-15) is a game for Arduboy by TEAM a.r.g. Play it in the browser, read the manual, and download the .hex.">
  <link rel="icon" href="https://t-arg.github.io/images/TEAMarg.gif">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fefefd;
      color: #5d4c4b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fefefd;
      border-bottom: 3px solid #5d4c4b;
      padding: 20px;
      box-shadow: 0 2px 4px rgba(93, 76, 75, 0.15);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo {
      width: 121px;
      height: 46px;
    }

    .logo img {
      width: 121px;
      height: 46px;
      display: block;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
    }

    .content-section {
      background: #fefefd;
      border: 2px solid #5d4c4b;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 4px 8px rgba(93, 76, 75, 0.15);
    }

    h1 {
      color: #5d4c4b;
      font-size: 32px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .game-id {
      color: #5d4c4b;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .game-banner {
      width: 100%;
      max-width: 700px;
      margin: 0 auto 32px;
      border: 2px solid #5d4c4b;
      border-radius: 5px;
      overflow: hidden;
      background: #5d4c4b;
    }

    .game-banner img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }

    h2 {
      color: #5d4c4b;
      font-size: 22px;
      margin-top: 36px;
      margin-bottom: 14px;
    }

    h2:first-of-type { margin-top: 8px; }

    p, li {
      line-height: 1.8;
      color: #5d4c4b;
    }

    p { margin-bottom: 14px; }

    a {
      color: #5d4c4b;
      font-weight: 600;
    }

    a:hover { color: #5d4c4b; opacity: 0.75; }

    .play-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 8px;
    }

    /* Arduboy community / Ardens player chrome */
    .pabeholder {
      background: #fefefd;
      padding: 10px 20px 8px 20px;
      display: block;
      width: 560px;
      max-width: 100%;
      margin: 8px auto 16px;
      border-radius: 20px;
      border: 2px solid #5d4c4b;
      box-shadow:
        inset 0 -1px 10px rgba(93, 76, 75, 0.18),
        0 1px 0 #5d4c4b,
        0 6px 1px rgba(93, 76, 75, 0.12),
        0 10px 16px rgba(93, 76, 75, 0.2);
    }


    .play-gate { position: relative; }
    .play-overlay {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background: #5d4c4b; color: #fefefd; border: 0; cursor: pointer;
      font-family: inherit; font-size: 28px; letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .play-overlay:hover, .play-overlay:focus-visible { background: #7a6563; }

    .pabe {
      display: block;
      width: 512px;
      height: 256px;
      max-width: 100%;
      margin: 10px auto 5px;
      border: 4px solid #5d4c4b;
      border-radius: 3px;
      box-shadow: 3px 3px 6px rgba(93, 76, 75, 0.35);
      background: #5d4c4b;
    }

    .hexlinkholder {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 28px;
      margin-left: 3px;
      gap: 8px;
    }

    .hexlink,
    .fullscreenlink {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      flex: 0 0 auto;
      color: #5d4c4b;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
    }

    .hexlink svg,
    .fullscreenlink svg {
      display: block;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .ardutitle {
      color: #5d4c4b;
      font-size: .8706em;
      line-height: 24px;
      font-weight: bold;
      flex: 1;
      text-align: center;
      text-decoration: none;
    }

    .smallbuttons {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      display: block;
    }

    .bmc-wrap {
      display: flex;
      justify-content: center;
      margin: 12px 0;
    }

    .kbd-hint {
      font-size: 13px;
      color: #5d4c4b;
      text-align: center;
      margin-bottom: 8px;
    }

    .kbd-hint kbd {
      display: inline-block;
      background: #fefefd;
      border: 1px solid #5d4c4b;
      border-bottom-width: 2px;
      border-radius: 3px;
      padding: 0 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #5d4c4b;
    }

    .controls {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 10px 18px;
      margin: 16px 0 8px;
    }

    .controls dt {
      font-weight: 700;
      color: #5d4c4b;
    }

    .controls dd { color: #5d4c4b; }

    .sprite-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }

    .sprite-card {
      display: flex;
      gap: 14px;
      align-items: center;
      background: #fefefd;
      border: 2px solid #5d4c4b;
      border-radius: 5px;
      padding: 12px 14px;
    }

    .sprite-thumb {
      flex: 0 0 88px;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(45deg, rgba(93, 76, 75, 0.12) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(93, 76, 75, 0.12) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(93, 76, 75, 0.12) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(93, 76, 75, 0.12) 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
      background-color: #fefefd;
      border: 1px solid #5d4c4b;
      border-radius: 3px;
    }

    .sprite-thumb img {
      max-width: 80px;
      max-height: 80px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .sprite-card h3 {
      color: #5d4c4b;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .sprite-card p {
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
      color: #5d4c4b;
    }

    .links-row {
      margin-top: 28px;
      font-size: 14px;
    }

    footer {
      background: #fefefd;
      border-top: 3px solid #5d4c4b;
      padding: 30px 20px;
      text-align: center;
      margin-top: auto;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 15px 0;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: #fefefd;
      border: 2px solid #5d4c4b;
      border-radius: 50%;
      color: #5d4c4b;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    .social-links a:hover {
      background: #5d4c4b;
      color: #fefefd;
      transform: translateY(-3px);
    }

    footer p {
      color: #5d4c4b;
      font-size: 14px;
      margin-top: 15px;
    }

    @media (max-width: 640px) {
      .content-section { padding: 22px 16px; }
      h1 { font-size: 24px; }
      .pabeholder { width: 100%; padding: 8px 10px; }
      .pabe { width: 100%; height: auto; aspect-ratio: 2 / 1; }
      .controls { grid-template-columns: 1fr; gap: 4px; }
      .controls dt { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a class="logo" href="https://t-arg.github.io/" title="TEAM a.r.g.">
        <img src="https://t-arg.github.io/images/TEAMarg.gif" alt="TEAM a.r.g." width="121" height="46">
      </a>
    </div>
  </header>

  <main>
    <section class="content-section">
      <h1>Shadow Runner</h1>
      <p class="game-id">ID-15 · Arduboy · TEAM a.r.g.</p>

      <div class="game-banner">
        <img
          src="images/banner-ID-15.png"
          alt="Shadow Runner banner">
      </div>

      <div class="play-wrap">
        <div class="bmc-wrap">
          <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="TEAMarg" data-color="#5d4c4b" data-emoji="☕" data-font="Cookie" data-text="Cool game? Buy us a coffee" data-outline-color="#fefefd" data-font-color="#fefefd" data-coffee-color="#FFDD00"></script>
        </div>
        <div class="pabeholder">
          <div class="pabe play-gate" id="play-wrap">
            <button type="button" class="play-overlay" id="play-btn" aria-label="Click to play">Click to play</button>
          </div>
          <template id="player-tpl">
            <iframe
              class="pabe"
              title="Shadow Runner — Arduboy Simulator"
              src="https://T-arg.github.io/ardens-web/?fg=fefefd&amp;bg=5d4c4b&amp;blah=https://raw.githubusercontent.com/T-arg/ID-15-Shadow-Runner/refs/heads/master/SHRUN_AB/build/arduino.avr.leonardo/SHRUN_AB.ino.hex&amp;g=none&amp;z=1"
              allow="fullscreen; autoplay"></iframe>
          </template>
          <div class="hexlinkholder">
            <a
              class="hexlink"
              id="hex-download"
              title="Download SHRUN_AB.ino.hex"
              href="https://raw.githubusercontent.com/T-arg/ID-15-Shadow-Runner/refs/heads/master/SHRUN_AB/build/arduino.avr.leonardo/SHRUN_AB.ino.hex"
              download="SHRUN_AB.ino.hex">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#5d4c4b" d="M12 3a1 1 0 0 1 1 1v9.6l2.3-2.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L11 13.6V4a1 1 0 0 1 1-1zm-7 14a1 1 0 0 1 1 1v2h12v-2a1 1 0 1 1 2 0v3H4v-3a1 1 0 0 1 1-1z"/>
              </svg>
              download
            </a>
            <a
              class="ardutitle"
              href="https://T-arg.github.io/ardens-web/?fg=fefefd&amp;bg=5d4c4b&amp;blah=https://raw.githubusercontent.com/T-arg/ID-15-Shadow-Runner/refs/heads/master/SHRUN_AB/build/arduino.avr.leonardo/SHRUN_AB.ino.hex&amp;g=none&amp;z=1"
              target="_blank"
              rel="noopener"
              title="Created by brow1067">Arduboy Simulator</a>
            <a
              class="fullscreenlink"
              href="https://T-arg.github.io/ardens-web/?fg=fefefd&amp;bg=5d4c4b&amp;blah=https://raw.githubusercontent.com/T-arg/ID-15-Shadow-Runner/refs/heads/master/SHRUN_AB/build/arduino.avr.leonardo/SHRUN_AB.ino.hex&amp;g=none&amp;z=1"
              target="_blank"
              rel="noopener"
              title="Play fullscreen">
              fullscreen
              <svg class="smallbuttons" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#5d4c4b" d="M4 4h7v2H6v5H4V4zm9 0h7v7h-2V6h-5V4zM4 13h2v5h5v2H4v-7zm14 0h2v7h-7v-2h5v-5z"/>
              </svg>
            </a>
          </div>
        </div>
        <p class="kbd-hint">
          <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> move ·
          <kbd>A</kbd> / <kbd>Z</kbd> A button ·
          <kbd>B</kbd> / <kbd>S</kbd> / <kbd>X</kbd> B button
        </p>
        <div class="bmc-wrap">
          <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="TEAMarg" data-color="#5d4c4b" data-emoji="☕" data-font="Cookie" data-text="Cool game? Buy us a coffee" data-outline-color="#fefefd" data-font-color="#fefefd" data-coffee-color="#FFDD00"></script>
        </div>
      </div>

      <h2>The game</h2>
      <p>
        Manual coming soon.
      </p>

      <p class="links-row">
        Source and hex:
        <a href="https://github.com/T-arg/ID-15-Shadow-Runner">T-arg/ID-15-Shadow-Runner</a>
        · Simulator:
        <a href="https://github.com/tiberiusbrown/Ardens">Ardens</a>
      </p>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <div class="social-links">
        <a href="https://github.com/T-arg" title="GitHub">GH</a>
        <a href="https://twitter.com/JO3RI_ARG" title="Twitter">𝕏</a>
      </div>
      <p>© 2026 TEAM a.r.g. All rights reserved.</p>
    </div>
  </footer>
  <script>
    (function () {
      var link = document.getElementById('hex-download');
      if (!link) return;
      var hexUrl = 'https://raw.githubusercontent.com/T-arg/ID-15-Shadow-Runner/refs/heads/master/SHRUN_AB/build/arduino.avr.leonardo/SHRUN_AB.ino.hex';

      link.addEventListener('click', function (e) {
        e.preventDefault();
        fetch(hexUrl)
          .then(function (res) { if (!res.ok) throw new Error('hex'); return res.blob(); })
          .then(function (blob) {
            var url = URL.createObjectURL(new Blob([blob], { type: 'application/octet-stream' }));
            var a = document.createElement('a');
            a.href = url;
            a.download = 'SHRUN_AB.ino.hex';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          })
          .catch(function () {
            window.location.href = hexUrl;
          });
      });
    })();
  </script>
  <script>
    document.getElementById('play-btn').addEventListener('click', function () {
      var wrap = document.getElementById('play-wrap');
      var frame = document.getElementById('player-tpl').content.firstElementChild.cloneNode(true);
      wrap.replaceWith(frame);
      frame.focus();
    });
  </script>
</body>
</html>
